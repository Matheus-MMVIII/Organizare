services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: organizare-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8080}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-8192}
      SERVER_BACKLOG: ${SERVER_BACKLOG:-50}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-organizare-db}
      DB_USER: ${POSTGRES_USER:-macinha}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-99146632}
    ports:
      - "${APP_PORT:-8080}:${PORT:-8080}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: organizare-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-organizare-db}
      POSTGRES_USER: ${POSTGRES_USER:-macinha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-99146632}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-macinha} -d ${POSTGRES_DB:-organizare-db}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
